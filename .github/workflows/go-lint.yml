name: Go lint

on:
  pull_request:
    types: [synchronize, opened]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '.golangci.yml'
      - '.github/workflows/go-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # golangci-lint must be built with a Go at least as new as go.mod's go directive.
      # Go 1.27.2+ emits export data V5, which needs v2.14.0+ (x/tools v0.50.0).
      # Use the v8 action line for golangci-lint v2 (v6 is v1-only).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.15.0
