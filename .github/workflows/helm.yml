name: Helm

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'charts/**'
      - 'example/values.example.yaml'
      - 'hack/check_chart_package.sh'
      - '.github/workflows/helm.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'example/values.example.yaml'
      - 'hack/check_chart_package.sh'
      - '.github/workflows/helm.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        helm-version: [v3.21.4, v4.2.4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm-version }}

      - name: Lint chart
        run: helm lint charts/workload-knocker --strict --values charts/workload-knocker/ci/test-values.yaml

      - name: Render default values
        run: >-
          helm template workload-knocker charts/workload-knocker
          --namespace workload-knocker
          --values charts/workload-knocker/ci/test-values.yaml
          > "${RUNNER_TEMP}/default.yaml"

      - name: Render explicit image tag and digest
        run: |
          helm template workload-knocker charts/workload-knocker \
            --values charts/workload-knocker/ci/test-values.yaml \
            --set-string image.tag=9.9.9-test \
            > "${RUNNER_TEMP}/tag.yaml"
          helm template workload-knocker charts/workload-knocker \
            --values charts/workload-knocker/ci/test-values.yaml \
            --set-string image.tag=ignored \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > "${RUNNER_TEMP}/digest.yaml"

      - name: Validate documented values
        run: |
          helm lint charts/workload-knocker --strict --values example/values.example.yaml
          helm lint charts/workload-knocker --strict --values charts/workload-knocker/ci/test-values.yaml \
            --set discord.secretName=workload-knocker-discord
          helm template workload-knocker charts/workload-knocker \
            --values example/values.example.yaml > "${RUNNER_TEMP}/example.yaml"

      - name: Assert rendered contract
        run: |
          app_version="$(helm show chart charts/workload-knocker | awk -F': *' '$1 == "appVersion" { gsub(/"/, "", $2); print $2; exit }')"
          grep --fixed-strings --quiet \
            "image: \"ghcr.io/murasame29/workload-knocker:${app_version}\"" "${RUNNER_TEMP}/default.yaml"
          grep --fixed-strings --quiet \
            'image: "ghcr.io/murasame29/workload-knocker:9.9.9-test"' "${RUNNER_TEMP}/tag.yaml"
          grep --fixed-strings --quiet \
            'image: "ghcr.io/murasame29/workload-knocker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' \
            "${RUNNER_TEMP}/digest.yaml"
          grep --fixed-strings --quiet 'name: SLACK_APP_TOKEN' "${RUNNER_TEMP}/default.yaml"
          if grep --fixed-strings --quiet 'name: DISCORD_BOT_TOKEN' "${RUNNER_TEMP}/default.yaml"; then
            echo 'Discord env rendered without discord.secretName' >&2
            exit 1
          fi
          helm template workload-knocker charts/workload-knocker \
            --values charts/workload-knocker/ci/test-values.yaml \
            --set discord.secretName=workload-knocker-discord \
            --set-string discord.guildId=123456789012345678 \
            > "${RUNNER_TEMP}/discord.yaml"
          grep --fixed-strings --quiet 'name: DISCORD_BOT_TOKEN' "${RUNNER_TEMP}/discord.yaml"
          grep --fixed-strings --quiet 'name: "workload-knocker-discord"' "${RUNNER_TEMP}/discord.yaml"
          grep --fixed-strings --quiet 'value: "123456789012345678"' "${RUNNER_TEMP}/discord.yaml"
          helm template workload-knocker charts/workload-knocker \
            --values charts/workload-knocker/ci/test-values.yaml \
            --set-string slack.secretName= \
            --set discord.secretName=workload-knocker-discord \
            > "${RUNNER_TEMP}/discord-only.yaml"
          grep --fixed-strings --quiet 'name: DISCORD_BOT_TOKEN' "${RUNNER_TEMP}/discord-only.yaml"
          if grep --fixed-strings --quiet 'name: SLACK_APP_TOKEN' "${RUNNER_TEMP}/discord-only.yaml"; then
            echo 'Slack env rendered without slack.secretName' >&2
            exit 1
          fi
          if grep --extended-regexp --quiet 'NEW_[R]ELIC' "${RUNNER_TEMP}/default.yaml"; then
            echo 'removed APM environment variable rendered' >&2
            exit 1
          fi

      - name: Reject invalid values
        run: |
          values=charts/workload-knocker/ci/test-values.yaml
          if helm lint charts/workload-knocker --strict --values "${values}" \
            --set-string image.digest=sha256:not-a-digest; then
            echo 'invalid image digest was accepted' >&2; exit 1
          fi
          if helm lint charts/workload-knocker --strict --values "${values}" \
            --set-string slack.secretName=; then
            echo 'no chat frontend Secret was accepted' >&2; exit 1
          fi
          if helm lint charts/workload-knocker --strict --values "${values}" \
            --set-string discord.guildId=not-a-snowflake; then
            echo 'non-numeric Discord guild ID was accepted' >&2; exit 1
          fi
          if helm lint charts/workload-knocker --strict --values "${values}" \
            --set replicaCount=2; then
            echo 'multiple replicas were accepted' >&2; exit 1
          fi
          if helm template workload-knocker charts/workload-knocker --values "${values}" \
            --set serviceAccount.create=false; then
            echo 'missing ServiceAccount name was accepted' >&2; exit 1
          fi

      - name: Operation mode matrix
        shell: bash
        run: |
          values=charts/workload-knocker/ci/test-values.yaml
          render() { helm template workload-knocker charts/workload-knocker --values "${values}" "$@"; }
          expect_cronjob() {
            local want="$1"; shift
            helm lint charts/workload-knocker --strict --values "${values}" "$@"
            local count
            count="$(render "$@" | grep --count '^kind: CronJob$' || true)"
            if [[ "${count}" != "${want}" ]]; then
              echo "expected ${want} CronJob for: $*, got ${count}" >&2; exit 1
            fi
          }
          expect_cronjob 0
          expect_cronjob 0 --set mode=full
          expect_cronjob 1 --set mode=full --set nightlyStop.enabled=true
          expect_cronjob 1 --set mode=scheduled-stop --set nightlyStop.enabled=true
          expect_cronjob 0 --set mode=off
          render --set mode=scheduled-stop --set nightlyStop.enabled=true \
            | grep --fixed-strings --quiet 'value: "scheduled-stop"'
          render --set nightlyStop.enabled=true \
            | grep --fixed-strings --quiet '/api/v1/stop-all'
          reject() {
            if render "$@" > /dev/null 2>&1; then
              echo "accepted invalid values: $*" >&2; exit 1
            fi
          }
          reject --set mode=scheduled-stop
          reject --set mode=off --set nightlyStop.enabled=true
          reject --set mode=bad
          reject --set api.tokenSecret.name=

      - name: Authorization policy and hot reload contract
        shell: bash
        run: |
          values=charts/workload-knocker/ci/test-values.yaml
          authz=charts/workload-knocker/ci/authz-values.yaml
          render() { helm template workload-knocker charts/workload-knocker --values "${values}" "$@"; }
          helm lint charts/workload-knocker --strict --values "${values}" --values "${authz}"
          default="$(render)"
          enabled="$(render --values "${authz}")"
          # Hot reload needs a directory-level projected volume and no checksum-triggered restart.
          for out in "${default}" "${enabled}"; do
            grep --fixed-strings --quiet 'projected:' <<< "${out}"
            if grep --quiet 'checksum/\|subPath' <<< "${out}"; then
              echo 'config checksum annotation or subPath mount rendered' >&2; exit 1
            fi
          done
          if grep --fixed-strings --quiet 'AUTHZ_CONFIG_PATH' <<< "${default}"; then
            echo 'authorization rendered while disabled' >&2; exit 1
          fi
          grep --fixed-strings --quiet 'value: /etc/workload-knocker/authz.yaml' <<< "${enabled}"
          grep --fixed-strings --quiet 'path: authz.yaml' <<< "${enabled}"
          grep --fixed-strings --quiet '"authz.yaml": |-' <<< "${enabled}"
          existing="$(render --set authz.enabled=true --set authz.existingConfigMap=my-policy)"
          grep --fixed-strings --quiet 'name: "my-policy"' <<< "${existing}"
          if grep --fixed-strings --quiet '"authz.yaml": |-' <<< "${existing}"; then
            echo 'inline policy rendered next to existingConfigMap' >&2; exit 1
          fi
          if render --set authz.enabled=true > /dev/null 2>&1; then
            echo 'authz.enabled without a policy was accepted' >&2; exit 1
          fi
          if render --set authz.enabled=maybe > /dev/null 2>&1; then
            echo 'non-boolean authz.enabled was accepted' >&2; exit 1
          fi

      - name: Package chart and verify license material
        shell: bash
        run: |
          helm package charts/workload-knocker --destination "${RUNNER_TEMP}"
          shopt -s nullglob
          archives=("${RUNNER_TEMP}"/workload-knocker-*.tgz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "expected exactly one packaged chart, found ${#archives[@]}" >&2
            exit 1
          fi
          bash hack/check_chart_package.sh "${archives[0]}" charts/workload-knocker
