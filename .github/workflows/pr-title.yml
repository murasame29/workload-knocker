name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "${TITLE}" =~ ${pattern} ]]; then
            echo "PR title must follow Conventional Commits: type(scope)!: subject" >&2
            echo "types: feat fix docs refactor perf test build ci chore revert" >&2
            echo "got: ${TITLE}" >&2
            exit 1
          fi
