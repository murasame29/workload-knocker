name: Release

# One vX.Y.Z tag (created by release-please) publishes the image, then the chart.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_PATH: charts/workload-knocker
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
  CHART_REFERENCE: oci://ghcr.io/${{ github.repository_owner }}/charts/workload-knocker

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check licenses
        run: bash hack/check_licenses.sh

      - name: Classify tag
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Move minor/latest aliases only when this is the highest stable tag.
          highest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort | tail -n 1)"
          alias=false
          if [[ "${highest}" == "${GITHUB_REF_NAME}" ]]; then
            alias=true
          fi
          {
            echo "version=${version}"
            echo "alias=${alias}"
            echo "build_date=$(date -u -d "@$(git show -s --format='%ct' "${GITHUB_SHA}")" +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse or reject existing image
        id: exact
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set +e
          out="$(docker manifest inspect "${IMAGE}:${VERSION}" 2>&1)"
          status=$?
          set -e
          if [[ ${status} -ne 0 ]]; then
            if grep --extended-regexp --ignore-case --quiet 'manifest unknown|no such manifest|not found' <<< "${out}"; then
              echo 'build=true' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "unable to resolve ${IMAGE}:${VERSION}" >&2
            echo "${out}" >&2
            exit 1
          fi
          # Immutable tag: only a re-run of the same commit may adopt it.
          docker pull --quiet --platform linux/amd64 "${IMAGE}:${VERSION}" >/dev/null
          revision="$(docker image inspect "${IMAGE}:${VERSION}" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "${revision}" != "${GITHUB_SHA}" ]]; then
            echo "image ${VERSION} already exists for another revision: ${revision}" >&2
            exit 1
          fi
          echo 'build=false' >> "${GITHUB_OUTPUT}"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.meta.outputs.alias }}
            type=semver,pattern={{major}},enable=${{ steps.meta.outputs.alias }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.alias }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}

      - name: Build and publish
        if: steps.exact.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify image identity
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --quiet --platform "${platform}" "${IMAGE}:${VERSION}" >/dev/null
            revision="$(docker image inspect "${IMAGE}:${VERSION}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            image_version="$(docker image inspect "${IMAGE}:${VERSION}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            if [[ "${revision}" != "${GITHUB_SHA}" || "${image_version}" != "${VERSION}" ]]; then
              echo "image identity mismatch (${platform})" >&2
              exit 1
            fi
          done

  chart:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Log in to GHCR
        run: >-
          printf '%s' "${GH_TOKEN}" |
          helm registry login "${REGISTRY}"
          --username "${GITHUB_ACTOR}"
          --password-stdin

      - name: Validate chart against the tag
        shell: bash
        run: |
          chart_version="$(helm show chart "${CHART_PATH}" | awk -F': *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }')"
          app_version="$(helm show chart "${CHART_PATH}" | awk -F': *' '$1 == "appVersion" { gsub(/"/, "", $2); print $2; exit }')"
          if [[ "${chart_version}" != "${VERSION}" || "${app_version}" != "${VERSION}" ]]; then
            echo "tag ${VERSION}, Chart version ${chart_version} and appVersion ${app_version} must match" >&2
            exit 1
          fi
          docker manifest inspect "${IMAGE}:${app_version}" >/dev/null

          helm lint "${CHART_PATH}" --strict --values "${CHART_PATH}/ci/test-values.yaml"
          helm template workload-knocker "${CHART_PATH}" \
            --namespace workload-knocker \
            --values "${CHART_PATH}/ci/test-values.yaml" \
            > "${RUNNER_TEMP}/workload-knocker.yaml"
          grep --fixed-strings --quiet "image: \"${IMAGE}:${app_version}\"" "${RUNNER_TEMP}/workload-knocker.yaml"

      - name: Package chart
        shell: bash
        run: |
          helm package "${CHART_PATH}" --destination "${RUNNER_TEMP}"
          bash hack/check_chart_package.sh \
            "${RUNNER_TEMP}/workload-knocker-${VERSION}.tgz" "${CHART_PATH}"

      - name: Publish OCI chart
        shell: bash
        run: |
          set +e
          out="$(helm show chart "${CHART_REFERENCE}" --version "${VERSION}" 2>&1)"
          status=$?
          set -e
          if [[ ${status} -eq 0 ]]; then
            # Immutable version: a re-run may adopt only byte-identical content.
            mkdir -p "${RUNNER_TEMP}/existing"
            helm pull "${CHART_REFERENCE}" --version "${VERSION}" --destination "${RUNNER_TEMP}/existing"
            cmp --silent "${RUNNER_TEMP}/workload-knocker-${VERSION}.tgz" \
              "${RUNNER_TEMP}/existing/workload-knocker-${VERSION}.tgz" || {
              echo "OCI chart ${VERSION} already exists with different content" >&2
              exit 1
            }
            echo "adopting existing OCI chart ${VERSION}"
          elif grep --extended-regexp --ignore-case --quiet 'manifest unknown|name unknown|not found' <<< "${out}"; then
            helm push "${RUNNER_TEMP}/workload-knocker-${VERSION}.tgz" "${CHART_REGISTRY}"
          else
            echo "unable to resolve the OCI chart" >&2
            echo "${out}" >&2
            exit 1
          fi

      - name: Attach chart to the release-please GitHub Release
        shell: bash
        run: |
          # The release is created by release-please; wait briefly for it to be visible.
          for _ in $(seq 1 30); do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" \
                "${RUNNER_TEMP}/workload-knocker-${VERSION}.tgz" --clobber
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Release ${GITHUB_REF_NAME} not found" >&2
          exit 1
