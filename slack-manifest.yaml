display_information:
  name: Workload Knocker
  description: Start and stop on-demand Kubernetes workloads from Slack
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: workload-knocker
    always_online: true
  slash_commands:
    # One command per cluster; each must match clusters[].slack.slashCommand.
    - command: /workload-knocker-stg
      description: Start or stop workloads in the staging cluster
      usage_hint: ""
      should_escape: false
    - command: /workload-knocker-dev
      description: Start or stop workloads in the development cluster
      usage_hint: ""
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write

settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
