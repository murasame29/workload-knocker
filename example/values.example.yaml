config:
  inline:
    controller:
      namespace: workload-control
    clusters:
      - env: stg
        name: example-staging
        provider:
          type: eks
          eks:
            region: ap-northeast-1
        frontends:
          slack:
            slashCommand: /workload-knocker-stg
            # notifyChannel: C0123ABCD   # optional: public start/ready/stop messages
      - env: dev
        name: example-development
        provider:
          type: eks
          eks:
            region: ap-northeast-1
            assumeRoleArn: arn:aws:iam::123456789012:role/workload-knocker-cross-account
        frontends:
          slack:
            slashCommand: /workload-knocker-dev

slack:
  secretName: workload-knocker-slack

# Optional Discord frontend (also add frontends.discord.command to the registry above).
# discord:
#   secretName: workload-knocker-discord
#   guildId: "123456789012345678"

# Serve KEDA's external scaler gRPC protocol for clusters with actuator: keda-external.
# externalScaler:
#   enabled: true
#   tls:
#     secretName: workload-knocker-grpc-tls   # optional kubernetes.io/tls Secret

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/workload-knocker

# Stop workloads 4h after a start unless the user picks another duration (max 12h). Annotations on the
# ScaledObject (workload-knocker.io/default-duration, /max-duration) override these per workload.
settings:
  defaultRunDuration: 4h
  maxRunDuration: 12h
  stopReminder: 15m
  # Field managers that block the direct actuator when they own spec.replicas (default: Argo CD, kustomize, Helm).
  # gitopsManagers: [argocd-controller, kustomize-controller, helm-controller]

# full | scheduled-stop | off (see docs/en/configuration.md)
mode: full

api:
  tokenSecret:
    name: workload-knocker-api
    key: api-token

nightlyStop:
  enabled: true
  schedule: "0 22 * * *"
  timeZone: Asia/Tokyo
