# Apply to every managed cluster. Map the controller identity (for EKS, the Access Entry
# kubernetes_groups) to the group "workload-knocker".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workload-knocker
rules:
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch"]
  # Scale targets are read once when a ScaledObject is first discovered, and polled for rollout
  # progress after Confirm (replica status and the pods behind them).
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "deployments/scale", "statefulsets/scale"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Only for `actuator: direct`: discover annotated workloads, read their managedFields, write the
  # scale subresource, and skip workloads targeted by an HPA. The workload objects are never written.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workload-knocker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workload-knocker
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: workload-knocker
---
# State ConfigMap (workload-state) lives in controller.namespace of each managed cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-knocker-state
  namespace: workload-control
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-knocker-state
  namespace: workload-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-knocker-state
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: workload-knocker
