# Local development against a kubeconfig context (e.g. kind).
controller:
  namespace: workload-control
clusters:
  - env: local
    name: kind-local
    provider:
      type: kubeconfig
      kubeconfig:
        path: ~/.kube/config
        context: kind-local
    frontends:
      slack:
        slashCommand: /workload-knocker-local
        # Optional channel ID for public start/ready/stop messages (bot needs chat:write and an invite).
        # notifyChannel: C0123ABCD
      # Discord (needs DISCORD_BOT_TOKEN; optional DISCORD_GUILD_ID). Lowercase, no leading slash.
      # discord:
      #   command: workload-knocker-local
      #   # Optional channel ID for public messages (bot needs View Channel and Send Messages there).
      #   notifyChannel: "123456789012345678"

  # A cluster without KEDA and Prometheus: annotate a Deployment or StatefulSet with
  # workload-knocker.io/enabled: "true" (and workload-knocker.io/replicas: "2" if it is not 1).
  # - env: small
  #   name: small-cluster
  #   actuator: direct
  #   provider:
  #     type: kubeconfig
  #     kubeconfig:
  #       path: ~/.kube/config
  #   frontends:
  #     slack:
  #       slashCommand: /workload-knocker-small

  # Several actuators behind one command: each workload is driven by the actuator that discovered it
  # (earlier entries win). Mutually exclusive with actuator.
  # - env: home
  #   name: home-cluster
  #   actuators: [keda-external, direct]
  #   provider:
  #     type: kubeconfig
  #     kubeconfig:
  #       path: ~/.kube/config
  #   frontends:
  #     discord:
  #       command: workload-knocker-home
