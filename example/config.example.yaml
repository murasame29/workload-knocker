# Local development against a kubeconfig context (e.g. kind).
controller:
  namespace: workload-control
clusters:
  - env: local
    name: kind-local
    provider:
      type: kubeconfig
      kubeconfig:
        path: ~/.kube/config
        context: kind-local
    frontends:
      slack:
        slashCommand: /workload-knocker-local
      # Discord (needs DISCORD_BOT_TOKEN; optional DISCORD_GUILD_ID). Lowercase, no leading slash.
      # discord:
      #   command: workload-knocker-local
