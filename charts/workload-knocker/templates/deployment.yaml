{{- if and (not .Values.slack.secretName) (not .Values.discord.secretName) }}
{{- fail "set slack.secretName or discord.secretName: at least one chat frontend Secret is required" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workload-knocker.fullname" . | quote }}
  labels:
    {{- include "workload-knocker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "workload-knocker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /* No checksum annotation for the registry or policy ConfigMaps: the controller hot reloads them without a Pod restart. */}}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "workload-knocker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "workload-knocker.serviceAccountName" . | quote }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: workload-knocker
          image: {{ include "workload-knocker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: CLUSTER_CONFIG_PATH
              value: /etc/workload-knocker/config.yaml
            {{- if .Values.authz.enabled }}
            - name: AUTHZ_CONFIG_PATH
              value: /etc/workload-knocker/authz.yaml
            {{- end }}
            - name: CONTROLLER_NAMESPACE
              value: {{ .Values.settings.controllerNamespace | quote }}
            - name: CLUSTER_RECONCILE_TIMEOUT
              value: {{ .Values.settings.clusterReconcileTimeout | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.settings.reconcileInterval | quote }}
            - name: STOP_ALL_TIMEOUT
              value: {{ .Values.settings.stopAllTimeout | quote }}
            - name: SHUTDOWN_TIMEOUT
              value: {{ .Values.settings.shutdownTimeout | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.settings.logLevel | quote }}
            {{- include "workload-knocker.apiEnv" . | nindent 12 }}
            {{- if .Values.slack.secretName }}
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slack.secretName | quote }}
                  key: {{ .Values.slack.appTokenKey | quote }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.slack.secretName | quote }}
                  key: {{ .Values.slack.botTokenKey | quote }}
            {{- end }}
            {{- if .Values.discord.secretName }}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discord.secretName | quote }}
                  key: {{ .Values.discord.botTokenKey | quote }}
            {{- with .Values.discord.guildId }}
            - name: DISCORD_GUILD_ID
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/workload-knocker
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- /* A projected volume (not subPath) so ConfigMap updates reach the Pod for hot reload. */}}
        - name: config
          projected:
            defaultMode: 0444
            sources:
              - configMap:
                  name: {{ include "workload-knocker.configMapName" . | quote }}
                  items:
                    - key: {{ .Values.config.key | quote }}
                      path: config.yaml
              {{- if .Values.authz.enabled }}
              - configMap:
                  name: {{ include "workload-knocker.authzConfigMapName" . | quote }}
                  items:
                    - key: {{ .Values.authz.key | quote }}
                      path: authz.yaml
              {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
