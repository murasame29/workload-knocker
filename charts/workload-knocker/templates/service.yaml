apiVersion: v1
kind: Service
metadata:
  name: {{ include "workload-knocker.fullname" . | quote }}
  labels:
    {{- include "workload-knocker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.externalScaler.enabled }}
    - name: grpc
      port: {{ .Values.externalScaler.port }}
      targetPort: grpc
      protocol: TCP
    {{- end }}
  selector:
    {{- include "workload-knocker.selectorLabels" . | nindent 4 }}
