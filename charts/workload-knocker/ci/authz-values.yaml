authz:
  enabled: true
  inline:
    version: 1
    default: deny
    rules:
      - env: stg
        namespaces: ["team-*"]
        workloads: ["*"]
        actions: [start, stop]
        subjects:
          slack:
            users: [U01ABCDEF]
            groups: [S01ABCDEF]
          discord:
            users: ["123456789012345678"]
            roles: ["223456789012345678"]
          api: true
