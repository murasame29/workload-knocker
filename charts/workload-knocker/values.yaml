# The controller holds chat gateway connections (Slack Socket Mode, Discord); keep a single replica.
replicaCount: 1

image:
  repository: ghcr.io/murasame29/workload-knocker
  pullPolicy: IfNotPresent
  # Empty tag defaults to Chart.appVersion. Digest takes priority over tag.
  tag: ""
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  # Set exactly one of existingConfigMap or inline.
  existingConfigMap: ""
  key: config.yaml
  # Cluster registry (see docs/en/configuration.md). Serialized without template evaluation.
  inline: {}

# Authorization policy (see docs/en/configuration.md#authorization). Hot reloaded from a ConfigMap.
# With enabled=false no policy file is mounted and every chat user and API caller may start and
# stop every workload. Set exactly one of existingConfigMap or inline when enabled.
authz:
  enabled: false
  existingConfigMap: ""
  key: authz.yaml
  # Policy document, serialized without template evaluation.
  inline: {}

slack:
  # Secret holding the Slack app-level token (xapp-...) and bot token (xoxb-...).
  secretName: ""
  appTokenKey: app-token
  botTokenKey: bot-token

# Discord frontend. Rendered only when secretName is set; configure frontends.discord in the registry too.
discord:
  # Secret holding the Discord bot token.
  secretName: ""
  botTokenKey: bot-token
  # Guild (server) ID for instant guild-scoped commands. Empty registers global commands.
  guildId: ""

# Operation mode (OPERATION_MODE env of the controller).
#   full           API can start, stop and stop-all. nightlyStop is optional.
#   scheduled-stop API can only start; stop endpoints return 403. nightlyStop.enabled must be true.
#   off            No scheduled stop. Stopping stays manual (chat). nightlyStop.enabled must be false.
mode: full

api:
  # Secret holding the bearer token that protects /api/v1/*. Required in every mode:
  # the API must never be unauthenticated.
  tokenSecret:
    name: ""
    key: api-token

# CronJob that calls POST /api/v1/stop-all. Allowed when mode is full or scheduled-stop.
nightlyStop:
  enabled: false
  schedule: "0 22 * * *"
  timeZone: Asia/Tokyo
  suspend: false
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  backoffLimit: 2
  # Per-attempt curl limits.
  requestTimeoutSeconds: 60
  curlRetries: 3
  image:
    repository: curlimages/curl
    tag: "8.23.0"
    # Digest of the multi-arch index for the tag above (verified with docker buildx imagetools inspect).
    # Takes priority over tag.
    digest: sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

settings:
  logLevel: info
  controllerNamespace: workload-control
  clusterReconcileTimeout: 2s
  reconcileInterval: 1m
  stopAllTimeout: 10s
  # Rollout progress shown after Confirm. The timeout must stay below 15m (Discord interaction token lifetime).
  rolloutPollInterval: 5s
  rolloutWatchTimeout: 10m
  shutdownTimeout: 5s
  # Run duration per start. defaultRunDuration "0" means no auto-stop; maxRunDuration caps starts and extensions.
  # ScaledObject annotations workload-knocker.io/default-duration and /max-duration override both per workload.
  defaultRunDuration: "0"
  maxRunDuration: 24h
  # Reminder before the auto-stop; "0" disables it.
  stopReminder: 15m

service:
  type: ClusterIP
  port: 8080

serviceAccount:
  create: true
  # Use this for IRSA, e.g. eks.amazonaws.com/role-arn.
  annotations: {}
  # Required when create is false.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

terminationGracePeriodSeconds: 30
revisionHistoryLimit: 3

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# Mount kubeconfig files here when a cluster uses provider.type=kubeconfig.
# /etc/workload-knocker is a read-only projected volume (registry and policy); mount elsewhere.
extraVolumes: []
extraVolumeMounts: []

# Prefer valueFrom/secretRef entries instead of literal secrets.
extraEnv: []
extraEnvFrom: []
